<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b8f25f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><title>Market Academy</title><style>
:root{--bg:#07090b;--panel:#0d1114;--panel2:#11171a;--line:#20282e;--text:#f4f6f7;--muted:#87929a;--lime:#b8f25f;--red:#ff6b6b;--blue:#75a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#18231a 0,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.side{position:fixed;right:0;top:0;bottom:0;width:235px;background:#090c0fdd;border-left:1px solid var(--line);padding:20px 13px;z-index:20;backdrop-filter:blur(12px)}.brand{font-weight:900;font-size:19px;margin:6px 8px 26px;display:flex;align-items:center}.brand i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--lime);color:#091006;font-style:normal;margin-left:9px}.nav button{display:block;width:100%;padding:12px 13px;margin:5px 0;border:1px solid transparent;border-radius:11px;background:none;color:var(--muted);text-align:right;font-weight:750}.nav button:hover,.nav .on{background:#151b1f;color:#fff;border-color:#293239}.main{margin-right:235px;padding:24px 38px 60px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:2px;color:#68737b;font-weight:900}.top b{display:block;margin-top:5px}.pill{border:1px solid #30402b;background:#111a10;color:var(--lime);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.hero{border:1px solid #2b392c;border-radius:24px;padding:40px;background:linear-gradient(120deg,#152116,#0b1011 65%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#b8f25f12;left:-70px;bottom:-140px}.hero h1{font-size:clamp(36px,5vw,66px);line-height:.98;margin:13px 0;letter-spacing:-2px}.lime{color:var(--lime)}.hero p{max-width:700px;color:#a4ada8;line-height:1.75}.btn{border:0;border-radius:11px;background:var(--lime);color:#091006;font-weight:900;padding:12px 17px;margin-top:10px}.btn.ghost{background:#151b1e;color:#fff;border:1px solid #293239}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:linear-gradient(180deg,#0f1417,#0b0f12);border:1px solid var(--line);border-radius:15px;padding:17px}.big{font-size:28px;font-weight:900;margin:6px 0}.muted{color:var(--muted)}.bar{height:7px;background:#252e2a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);border-radius:99px}.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.lesson{display:flex;align-items:center;gap:12px;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;text-align:right}.lesson:hover{border-color:#425040}.num{color:#69747b;font-weight:900}.lesson small{display:block;color:#717c83;margin-top:4px}.wrap{display:grid;grid-template-columns:210px 1fr;gap:20px}.list button{display:block;width:100%;text-align:right;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:10px;margin:5px 0}.list .sel{color:var(--lime);border-color:#3b4d32}.article{max-width:900px}.article h2{font-size:42px;margin:10px 0}.concept{border-right:3px solid var(--lime);background:#101711;border-radius:10px;padding:20px;margin:20px 0;line-height:1.75}.quiz{background:#0e1410;border:1px solid #2b382e;border-radius:14px;padding:18px;margin-top:12px}.ans{display:block;width:100%;text-align:right;background:#12181b;color:#fff;border:1px solid #293139;border-radius:9px;padding:12px;margin:7px 0}.correct{border-color:#8ebc57!important;background:#182412!important}.wrong{border-color:#a04d4d!important;background:#211315!important}.input{width:100%;margin-top:6px;padding:11px;background:#090d10;border:1px solid #293138;border-radius:9px;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar>*{min-width:120px}.quote{font-size:30px;font-weight:900}.up{color:var(--lime)}.down{color:var(--red)}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:right}.chartbox{height:300px;position:relative}.chartbox canvas{width:100%;height:100%}.tradegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.news{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.news a{color:#fff;text-decoration:none}.news a:hover{color:var(--lime)}.toast{position:fixed;left:18px;bottom:18px;background:#151b1f;border:1px solid #334047;padding:12px 15px;border-radius:12px;z-index:50;box-shadow:0 10px 35px #0008}.bottom{display:none}.danger{border-color:#513033}.note{font-size:12px;color:#778189;line-height:1.6}.tag{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:7px;color:#9ba4aa;font-size:11px;margin:3px}.success{color:var(--lime)}
@media(max-width:850px){.side{display:none}.main{margin:0;padding:14px 13px 86px}.grid,.grid4,.lessons,.tradegrid,.news,.wrap{grid-template-columns:1fr}.hero{padding:27px 20px}.hero h1{font-size:44px}.article h2{font-size:34px}.chartbox{height:240px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;background:#0b0f12ee;border-top:1px solid var(--line);z-index:30;backdrop-filter:blur(12px)}.bottom button{flex:1;background:none;border:0;color:#849097;padding:10px 3px;font-size:10px}.bottom .on{color:var(--lime)}}
</style></head><body><aside class="side"><div class="brand"><i>M</i>Market Academy</div><div id="nav" class="nav"></div><div class="card" style="margin-top:20px"><div class="eyebrow">MODE</div><b class="lime">SIMULATION</b><p class="note">המסחר כאן וירטואלי. אין חיבור לברוקר ואין ביצוע פקודות אמיתיות.</p></div></aside><main class="main"><div class="top"><div><div class="eyebrow">MARKET ACADEMY / PERSONAL LAB</div><b id="title">לומדים את השוק מהיסוד</b></div><span class="pill">● LIVE DATA</span></div><div id="app"></div></main><nav id="bottom" class="bottom"></nav><div id="toast" style="display:none"></div><script>
const API={quote:s=>fetch('/api/quote?symbol='+encodeURIComponent(s)).then(r=>r.json()),history:(s,r='1y')=>fetch('/api/history?symbol='+encodeURIComponent(s)+'&range='+r).then(r=>r.json()),news:s=>fetch('/api/news?symbol='+encodeURIComponent(s)).then(r=>r.json())};
const lessons=[
['01','מה זה שוק ההון?','מניות · בורסה · מדדים · ETF','מניה היא יחידת בעלות בחברה. המחיר בשוק נוצר ממפגש בין קונים ומוכרים, ולכן מחיר לבדו אינו אומר אם עסק “טוב”.'],
['02','איך מניה מתומחרת?','היצע · ביקוש · שווי שוק','שווי שוק בקירוב הוא מחיר מניה כפול מספר המניות. כדי להבין מחיר צריך להפריד בין מה שהשוק מתמחר לבין מה שהעסק מייצר.'],
['03','לקרוא דוחות','הכנסות · רווח · תזרים · חוב','הכנסות מספרות על המכירות; רווח מספר על התוצאה החשבונאית; תזרים עוזר להבין כמה מזומן העסק מייצר בפועל.'],
['04','מכפילים ויחסים','P/E · Margin · ROIC · Growth','יחסים פיננסיים שימושיים להשוואה, אבל אין “מספר קסם”. תמיד בודקים הקשר, תקופה וחברות דומות.'],
['05','השקעה לטווח ארוך','ETF · פיזור · הקצאה','פיזור יכול להפחית תלות בנכס אחד. הוא לא מבטיח תשואה ולא מונע ירידות.'],
['06','גרפים ושוק','Trend · Volume · Support · Resistance','גרף הוא דרך לתאר מחיר לאורך זמן. אינדיקטור אינו מכונת חיזוי; הוא כלי שמארגן מידע.'],
['07','Trading System','Setup · Entry · Exit · Journal','מסחר שיטתי מתחיל בכללים שנכתבים מראש: מה התנאי לכניסה, מתי יוצאים ומה הסיכון המקסימלי.'],
['08','Risk Management','Position Size · Stop · R:R','גודל פוזיציה צריך להיגזר מהסיכון שהגדרת, לא מהרצון “להרוויח יותר”.'],
['09','Backtesting','בדיקה היסטורית','Backtest מריץ כלל על נתוני עבר. תוצאה היסטורית אינה הבטחה לעתיד, וצריך להיזהר מ-overfitting.'],
['10','Short & Leverage','שורט · מינוף · סיכונים','שורט ומינוף מגדילים את החשיפה. לומדים את המנגנון בסימולציה לפני שמדברים על כסף אמיתי.'],
['11','Psychology','FOMO · Loss Aversion · Discipline','מטרת היומן היא לזהות החלטות חוזרות, לא להאשים את עצמך. מתעדים סיבה, סיכון ותוצאה.'],
['12','Final Mission','לבנות תזה ולבדוק אותה','מחברים נתוני חברה, מחיר, סיכון ותרחישים. רק אז מתקבלת החלטה לימודית שאפשר לבדוק ולמדוד.']];
let state=JSON.parse(localStorage.getItem('ma-v2')||'null')||{done:[],xp:0,cash:100000,positions:{},trades:[],watch:['AAPL','MSFT','NVDA','SPY'],journal:[]};function save(){localStorage.setItem('ma-v2',JSON.stringify(state))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.className='toast';x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function nav(active){const a=[['home','⌂','בית'],['learn','◈','לימוד'],['markets','◉','Markets'],['paper','↗','Simulator'],['backtest','⌁','Backtest'],['journal','▤','יומן']];const h=a.map(x=>`<button class="${active===x[0]?'on':''}" onclick="show('${x[0]}')">${x[1]} &nbsp;${x[2]}</button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('bottom').innerHTML=h}
function home(){nav('home');const p=Math.round(state.done.length/lessons.length*100);document.getElementById('title').textContent='בונים הבנה אמיתית של השוק';document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">FOUNDATIONS → MARKETS → TRADING → BACKTEST</div><h1>לומדים.<br><span class="lime">מתרגלים.</span><br>בודקים.</h1><p>מסלול מאפס שמחבר לימוד, נתוני שוק, סימולציה ו-backtesting. הכסף באפליקציה וירטואלי בלבד.</p><button class="btn" onclick="learn(${Math.min(state.done.length,lessons.length-1)})">${state.done.length?'המשך מהנקודה שלי':'התחל מאפס'} ←</button></section><div class="grid4"><div class="card"><div class="eyebrow">COURSE</div><div class="big">${state.done.length}/${lessons.length}</div><div class="bar"><i style="width:${p}%"></i></div><p class="muted">${p}% הושלם</p></div><div class="card"><div class="eyebrow">XP</div><div class="big lime">${state.xp}</div><p class="muted">נקודות למידה</p></div><div class="card"><div class="eyebrow">PAPER CASH</div><div class="big">$${fmt(state.cash)}</div><p class="muted">יתרה וירטואלית</p></div><div class="card"><div class="eyebrow">WATCHLIST</div><div class="big">${state.watch.length}</div><p class="muted">נכסים במעקב</p></div></div><h2 style="margin-top:32px">המסלול שלך</h2><div class="lessons">${lessons.map((l,i)=>`<button class="lesson" onclick="learn(${i})"><span class="num">${l[0]}</span><span><b>${l[1]}</b><small>${l[2]}</small></span><span>${state.done.includes(i)?'✓':'→'}</span></button>`).join('')}</div><div class="card" style="margin-top:12px"><b>הכלל שלנו</b><p class="muted">לא “מנחשים מניה”. מנסחים השערה, אוספים ראיות, מגדירים סיכון, ואז בודקים אותה בסימולציה או ב-backtest.</p></div>`}
function qFor(i){const qs=[['מה קנית כשקנית מניה?',['חלק בעלות בחברה','הלוואה לממשלה','רק גרף מחיר']],['שווי שוק בקירוב הוא?', ['מחיר מניה × מספר מניות','רווח ÷ חוב','מחזור ÷ מניות']],['איזה נתון מתאר מכירות?',['הכנסות','מחיר מניה','Volume']],['P/E משווה בין?',['מחיר לרווח','חוב למזומן','מניות לנכסים']],['למה מפזרים?',['להפחית תלות בנכס יחיד','להבטיח רווח','להעלים סיכון']],['מהו Trading שיטתי?',['פעולה לפי כללים כתובים','ניחוש נר הבא','קנייה בלי תוכנית']],['מה מגדירים לפני כניסה?',['כניסה, יציאה וסיכון','רק יעד רווח','רק טיקר']],['ממה נגזר Position Size?',['מהסיכון שהוגדר','מכמה כסף יש בבנק','ממספר העוקבים']],['מה עושה Backtest?',['בודק כלל על עבר','מבטיח עתיד','רק מחפש עסקאות טובות']],['מה מינוף עושה?',['מגדיל חשיפה וגם הפסד אפשרי','מעלים סיכון','מבטיח רווח']],['מהו Journal טוב?',['תיעוד סיבה, סיכון ותוצאה','רק רווחים','רק עסקאות מוצלחות']],['מה מחברים ב-Final Mission?',['תזה, נתונים, סיכון ותרחישים','ניחוש בלבד','כותרת חדשות']]];return {q:qs[i][0],a:qs[i][1]}}
function learn(i){nav('learn');const l=lessons[i],q=qFor(i);document.getElementById('title').textContent='Learning Path';document.getElementById('app').innerHTML=`<div class="wrap"><div class="list">${lessons.map((x,n)=>`<button class="${n===i?'sel':''}" onclick="learn(${n})">${x[0]} · ${x[1]} ${state.done.includes(n)?'✓':''}</button>`).join('')}</div><article class="article"><div class="eyebrow">LESSON ${l[0]}</div><h2>${l[1]}</h2><p class="muted">${l[2]}</p><div class="concept"><b class="lime">CORE IDEA</b><h3>${l[3]}</h3><p class="note">הערה: התוכן חינוכי. הוא לא מהווה המלצה לקנייה או מכירה.</p></div><div class="grid"><div class="card"><b>מה צריך לדעת</b><p class="muted">הגדרה → דוגמה → מה הנתון כן אומר → מה הוא לא אומר.</p></div><div class="card"><b>MISSION</b><p class="muted">ענה על השאלה כדי לסמן את השיעור.</p></div><div class="card"><b>סטטוס</b><p class="success">${state.done.includes(i)?'✓ הושלם':'טרם הושלם'}</p></div></div><div class="quiz"><h3>${q.q}</h3>${q.a.map((a,n)=>`<button class="ans" onclick="answer(${i},${n})">${a}</button>`).join('')}<div id="fb" class="muted">בחר תשובה.</div></div><div class="toolbar"><button class="btn ghost" onclick="learn(${Math.max(0,i-1)})">← הקודם</button><button class="btn" onclick="learn(${Math.min(lessons.length-1,i+1)})">הבא →</button></div></article></div>`}
function answer(i,n){document.querySelectorAll('.ans').forEach((x,j)=>{x.disabled=true;if(j===0)x.classList.add('correct');if(j===n&&n!==0)x.classList.add('wrong')});if(n===0){if(!state.done.includes(i)){state.done.push(i);state.xp+=100;save()}document.getElementById('fb').innerHTML='<span class="lime">✓ נכון. +100 XP</span>'}else document.getElementById('fb').textContent='לא הפעם. התשובה הנכונה מסומנת בירוק.'}
function markets(){nav('markets');document.getElementById('title').textContent='Markets · Live';document.getElementById('app').innerHTML=`<div class="toolbar"><input id="sym" class="input" style="max-width:260px" value="${state.watch[0]||'AAPL'}" placeholder="AAPL / MSFT / SPY"><button class="btn" onclick="loadMarket()">טען נתון</button><button class="btn ghost" onclick="addWatch()">＋ Watchlist</button></div><div id="marketout"><div class="card"><span class="muted">טוען נתוני שוק...</span></div></div><h3>Watchlist</h3><div id="watch" class="grid"></div>`;renderWatch() ;loadMarket()}
async function loadMarket(){const s=(document.getElementById('sym')?.value||'AAPL').trim().toUpperCase();const out=document.getElementById('marketout');if(!out)return;out.innerHTML='<div class="card">טוען...</div>';try{const [q,h,n]=await Promise.all([API.quote(s),API.history(s,'6mo'),API.news(s)]);out.innerHTML=`<div class="grid4"><div class="card"><div class="eyebrow">${s}</div><div class="quote">$${num(q.price)}</div><div class="${q.change>=0?'up':'down'}">${q.change>=0?'+':''}${num(q.change)} (${num(q.changePct)}%)</div></div><div class="card"><div class="eyebrow">VOLUME</div><div class="big">${fmt(q.volume)}</div><span class="muted">${q.currency||'USD'}</span></div><div class="card"><div class="eyebrow">DAY RANGE</div><div class="big">${num(q.low)}–${num(q.high)}</div></div><div class="card"><div class="eyebrow">UPDATED</div><div class="big" style="font-size:18px">${new Date(q.timestamp*1000).toLocaleString('he-IL')}</div><span class="muted">מקור: Yahoo Finance API</span></div></div><div class="card" style="margin-top:12px"><div class="eyebrow">PRICE · 6 MONTHS</div><div class="chartbox"><canvas id="chart"></canvas></div></div><div class="card" style="margin-top:12px"><h3>News / Research</h3><div class="news">${(n.news||[]).slice(0,6).map(x=>`<a href="${x.link}" target="_blank"><b>${escapeHtml(x.title)}</b><div class="note">${x.publisher||''}</div></a>`).join('')||'<span class="muted">אין חדשות זמינות.</span>'}</div></div>`;drawChart('chart',h)}catch(e){out.innerHTML='<div class="card danger">לא הצלחתי להביא נתונים כרגע. נסה שוב בעוד רגע.</div>'}}
function renderWatch(){const w=document.getElementById('watch');if(!w)return;w.innerHTML=state.watch.map(s=>`<div class="card"><b>${s}</b><div id="w-${s}" class="muted">טוען...</div><button class="btn ghost" onclick="document.getElementById('sym').value='${s}';loadMarket()">פתח</button></div>`).join('');state.watch.forEach(async s=>{try{const q=await API.quote(s);const e=document.getElementById('w-'+s);if(e)e.innerHTML=`<span class="${q.change>=0?'up':'down'}">$${num(q.price)} · ${q.change>=0?'+':''}${num(q.changePct)}%</span>`}catch{}})}
function addWatch(){const s=(document.getElementById('sym')?.value||'').trim().toUpperCase();if(s&&!state.watch.includes(s)){state.watch.unshift(s);state.watch=state.watch.slice(0,8);save();renderWatch();toast('נוסף ל-Watchlist')}}
function paper(){nav('paper');document.getElementById('title').textContent='Paper Trading';const positions=Object.entries(state.positions);document.getElementById('app').innerHTML=`<div class="grid4"><div class="card"><div class="eyebrow">CASH</div><div class="big">$${fmt(state.cash)}</div></div><div class="card"><div class="eyebrow">TRADES</div><div class="big">${state.trades.length}</div></div><div class="card"><div class="eyebrow">POSITIONS</div><div class="big">${positions.length}</div></div><div class="card"><div class="eyebrow">MODE</div><div class="big lime">SIM</div></div></div><div class="card" style="margin-top:12px"><h3>פתיחת עסקה וירטואלית</h3><div class="tradegrid"><label>Symbol<input id="ps" class="input" value="AAPL"></label><label>Side<select id="side" class="input"><option>BUY</option><option>SELL</option></select></label><label>Quantity<input id="pq" class="input" type="number" min="1" value="1"></label><label>Price<input id="pp" class="input" type="number" step="0.01" placeholder="מחיר נוכחי"></label></div><button class="btn" onclick="paperTrade()">רשום פעולה</button><p class="note">המערכת לא שולחת פקודות לשוק. היא רק מנהלת תיק וירטואלי לצורכי לימוד.</p></div><div class="grid"><div class="card"><h3>Positions</h3>${positions.length?`<table class="table"><tr><th>Symbol</th><th>Qty</th><th>Avg</th></tr>${positions.map(([s,p])=>`<tr><td>${s}</td><td>${p.qty}</td><td>$${num(p.avg)}</td></tr>`).join('')}</table>`:'<span class="muted">אין פוזיציות.</span>'}</div><div class="card"><h3>Recent trades</h3>${state.trades.slice(-8).reverse().map(t=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">${t.side} · ${t.symbol} · ${t.qty} @ $${num(t.price)}</div>`).join('')||'<span class="muted">אין עסקאות.</span>'}</div></div>`}
function paperTrade(){const s=document.getElementById('ps').value.trim().toUpperCase(),side=document.getElementById('side').value,q=Math.floor(+document.getElementById('pq').value),price=+document.getElementById('pp').value;if(!s||!q||!price){toast('מלא Symbol, כמות ומחיר');return}if(side==='BUY'&&q*price>state.cash){toast('אין מספיק מזומן וירטואלי');return}const p=state.positions[s]||{qty:0,avg:0};if(side==='BUY'){p.avg=(p.avg*p.qty+price*q)/(p.qty+q);p.qty+=q;state.cash-=q*price}else{if(q>p.qty){toast('אין מספיק יחידות וירטואליות');return}p.qty-=q;state.cash+=q*price;if(!p.qty)delete state.positions[s]}if(side==='BUY')state.positions[s]=p;state.trades.push({symbol:s,side,qty:q,price,time:Date.now()});state.xp+=10;save();paper();toast('נרשמה עסקה וירטואלית')}
async function backtest(){nav('backtest');document.getElementById('title').textContent='Backtesting Lab';document.getElementById('app').innerHTML=`<div class="card"><h2>Backtest · SMA Crossover</h2><p class="muted">בודקים כלל היסטורי על נתוני שוק. זה לא חיזוי.</p><div class="tradegrid"><label>Symbol<input id="bs" class="input" value="SPY"></label><label>Fast SMA<input id="fast" class="input" type="number" value="20"></label><label>Slow SMA<input id="slow" class="input" type="number" value="50"></label><label>תקופה<select id="range" class="input"><option value="1y">1 שנה</option><option value="2y">2 שנים</option><option value="5y">5 שנים</option></select></label></div><button class="btn" onclick="runBacktest()">הרץ Backtest</button></div><div id="bt" style="margin-top:12px"></div>`}
async function runBacktest(){const s=document.getElementById('bs').value.trim().toUpperCase(),fast=+document.getElementById('fast').value,slow=+document.getElementById('slow').value,r=document.getElementById('range').value;if(fast>=slow||fast<2){toast('Fast חייב להיות קטן מ-Slow');return}const el=document.getElementById('bt');el.innerHTML='<div class="card">מוריד נתונים ומריץ...</div>';try{const h=await API.history(s,r);const closes=h.data.map(x=>x.close);let cash=100000,shares=0,entry=0,peak=100000,maxDD=0,buys=0,sells=0;const eq=[];for(let i=slow;i<closes.length;i++){const f=avg(closes.slice(i-fast,i)),sl=avg(closes.slice(i-slow,i));if(shares===0&&f>sl){shares=Math.floor(cash/closes[i]);cash-=shares*closes[i];entry=closes[i];buys++}else if(shares>0&&f<sl){cash+=shares*closes[i];shares=0;sells++}const v=cash+shares*closes[i];peak=Math.max(peak,v);maxDD=Math.max(maxDD,(peak-v)/peak);eq.push(v)}const final=cash+shares*closes.at(-1),ret=(final/100000-1)*100,bh=(closes.at(-1)/closes[slow]-1)*100;el.innerHTML=`<div class="grid4"><div class="card"><div class="eyebrow">STRATEGY RETURN</div><div class="big ${ret>=0?'up':'down'}">${ret.toFixed(2)}%</div></div><div class="card"><div class="eyebrow">BUY & HOLD</div><div class="big">${bh.toFixed(2)}%</div></div><div class="card"><div class="eyebrow">MAX DRAWDOWN</div><div class="big down">-${(maxDD*100).toFixed(2)}%</div></div><div class="card"><div class="eyebrow">TRADES</div><div class="big">${buys+sells}</div></div></div><div class="card" style="margin-top:12px"><h3>Equity curve</h3><div class="chartbox"><canvas id="btchart"></canvas></div></div><div class="card" style="margin-top:12px"><b>איך לקרוא את זה:</b><p class="note">Backtest הוא ניסוי על העבר. עמלות, slippage, מיסוי, פערי ביצוע ו-overfitting יכולים לשנות תוצאות. אל תשתמש בתוצאה הזאת כהוכחה שהאסטרטגיה תרוויח בעתיד.</p></div>`;drawSeries('btchart',eq)}catch(e){el.innerHTML='<div class="card danger">הנתונים לא זמינים כרגע. נסה שוב.</div>'}}
function journal(){nav('journal');document.getElementById('title').textContent='Trading Journal';document.getElementById('app').innerHTML=`<div class="card"><h2>יומן החלטות</h2><p class="muted">המטרה: ללמוד מהתהליך, לא לרדוף אחרי רווח.</p><label>Symbol<input id="js" class="input" value="AAPL"></label><label>למה אני בודק את זה?<textarea id="jt" class="input" rows="4" placeholder="תזה / שאלה / סיבה..."></textarea></label><button class="btn" onclick="addJournal()">שמור רשומה</button></div><div class="card" style="margin-top:12px"><h3>רשומות</h3>${state.journal.slice().reverse().map(j=>`<div style="border-bottom:1px solid var(--line);padding:13px 0"><b>${j.symbol}</b><span class="tag">${new Date(j.time).toLocaleDateString('he-IL')}</span><p class="muted">${escapeHtml(j.text)}</p></div>`).join('')||'<span class="muted">עדיין אין רשומות.</span>'}</div>`}
function addJournal(){const s=document.getElementById('js').value.trim().toUpperCase(),t=document.getElementById('jt').value.trim();if(!t){toast('כתוב קודם תזה או שאלה');return}state.journal.push({symbol:s,text:t,time:Date.now()});state.xp+=20;save();journal();toast('נשמר ביומן')}
function drawChart(id,h){const c=document.getElementById(id),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth,hgt=c.clientHeight;c.width=w*dpr;c.height=hgt*dpr;ctx.scale(dpr,dpr);const vals=h.data.map(x=>x.close),min=Math.min(...vals),max=Math.max(...vals);ctx.strokeStyle='#b8f25f';ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{const x=i/(vals.length-1)*w,y=hgt-12-(v-min)/(max-min||1)*(hgt-25);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function drawSeries(id,vals){const c=document.getElementById(id),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);const min=Math.min(...vals),max=Math.max(...vals);ctx.strokeStyle='#75a7ff';ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{const x=i/(vals.length-1)*w,y=h-12-(v-min)/(max-min||1)*(h-25);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}function fmt(x){return Number(x||0).toLocaleString('en-US',{maximumFractionDigits:0})}function num(x){return Number(x||0).toLocaleString('en-US',{maximumFractionDigits:2})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(x){({home,learn:()=>learn(Math.min(state.done.length,lessons.length-1)),markets,paper,backtest,journal}[x]||home)()}home();
</script></body></html>
